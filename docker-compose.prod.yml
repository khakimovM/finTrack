services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrack-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrack_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fintrack}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintrack} -d ${POSTGRES_DB:-fintrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fintrack-redis-prod
    restart: always
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fintrack-api-prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fintrack}:${POSTGRES_PASSWORD:-fintrack_secure_pass}@postgres:5432/${POSTGRES_DB:-fintrack}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-fintrack_production_jwt_access_secret_min32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-fintrack_production_jwt_refresh_secret_min32chars}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: fintrack-web-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata_prod:
  redisdata_prod:
