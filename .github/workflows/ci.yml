name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fintrack"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # The e2e harness refuses any database whose name does not end in _test.
      DATABASE_URL: postgresql://fintrack:fintrack@localhost:5432/fintrack_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_that_is_long_enough_32chars
      JWT_REFRESH_SECRET: ci_refresh_secret_that_is_long_enough_32ch
      CLIENT_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Deploy database migrations (separate step)
        run: npm run db:deploy

      - name: Schema and migrations are in sync
        run: npm --workspace=api exec -- prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: API e2e (real Postgres + Redis)
        run: npm --workspace=api run test:e2e
